<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hispania Docs — Resumen</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ocean:#0B4F6C;--ocean-mid:#1A6E8E;--ocean-light:#E8F4F8;
  --surface:#F7FAFB;--white:#fff;--ink:#0D1B22;--muted:#6B8898;
  --border:#D4E5ED;--green:#1A9E6E;--green-bg:#E6F7F2;
  --amber:#D97706;--amber-bg:#FEF3C7;--red:#DC2626;
  --shadow:0 1px 3px rgba(11,79,108,0.08),0 4px 16px rgba(11,79,108,0.06);
}
body{font-family:'Inter',sans-serif;background:var(--surface);min-height:100vh;}
.topbar{background:var(--ocean);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.topbar-left{display:flex;align-items:center;gap:12px;}
.btn-back{background:rgba(255,255,255,0.12);border:none;color:white;font-size:13px;font-weight:600;padding:7px 13px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
.btn-back:hover{background:rgba(255,255,255,0.2);}
.topbar-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:white;}
.topbar-sub{font-size:11px;color:rgba(255,255,255,0.6);margin-top:1px;}
.main-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;max-width:1100px;margin:0 auto;padding:20px;}
.col-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;}

/* IZQUIERDA */
.person-block{background:white;border:1.5px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);}
.person-header{background:var(--ocean-light);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.person-name{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--ocean);}
.person-phone{font-size:11px;color:var(--muted);margin-top:1px;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge-ok{background:var(--green-bg);color:var(--green);}
.badge-pending{background:var(--amber-bg);color:var(--amber);}
.btn-del{background:white;border:1.5px solid #fca5a5;color:var(--red);border-radius:7px;font-size:13px;font-weight:700;padding:4px 9px;cursor:pointer;flex-shrink:0;}
.btn-del:hover{background:var(--red);color:white;border-color:var(--red);}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px;background:white;}
.copy-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;}
.copy-row{display:flex;gap:5px;align-items:center;}
.copy-val{flex:1;padding:6px 10px;background:var(--surface);border:1.5px solid var(--border);border-radius:7px;font-size:12px;color:var(--ink);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-copy{padding:6px 10px;background:var(--ocean-light);border:1.5px solid var(--border);border-radius:7px;font-size:11px;font-weight:600;color:var(--ocean);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.btn-copy:hover{background:var(--ocean);color:white;}
.btn-copy.copied{background:var(--green);color:white;border-color:var(--green);}
.docs-row{display:flex;gap:7px;padding:0 16px 12px;background:white;flex-wrap:wrap;}
.doc-thumb{border:1.5px solid var(--border);border-radius:8px;overflow:hidden;width:100px;}
.doc-thumb-hdr{padding:4px 8px;background:var(--surface);font-size:9px;font-weight:600;color:var(--ocean);}
.doc-thumb-img{width:100%;height:56px;object-fit:cover;display:block;cursor:pointer;}
.doc-thumb-img.ph{background:linear-gradient(135deg,#e8f4f8,#d4e5ed);display:flex;align-items:center;justify-content:center;font-size:20px;height:56px;}
.doc-thumb-ftr{padding:3px 8px;font-size:9px;color:var(--green);font-weight:600;}
.companion-block{border-left:3px solid var(--ocean-mid);margin:0 16px 12px;border-radius:0 8px 8px 0;overflow:hidden;}
.companion-hdr{background:var(--ocean-light);padding:6px 12px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:var(--ocean-mid);}
.pending-block{background:white;border:1.5px dashed var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;opacity:0.55;}
.pending-hdr{background:var(--amber-bg);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.pending-name{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--amber);}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

/* DERECHA: hoja DNIs */
.dni-sheet-wrapper{position:sticky;top:68px;}
.btn-print-dni{padding:7px 13px;background:var(--ocean);color:white;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;}
.btn-print-dni:hover{background:var(--ocean-mid);}
.dni-sheet{background:white;border:1.5px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);}
.dni-sheet-top{text-align:center;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:10px;}
.dni-sheet-brand{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;color:var(--ocean);}
.dni-sheet-date{font-size:10px;color:var(--muted);margin-top:1px;}
.dni-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.dni-cell{border:1px solid var(--border);border-radius:5px;overflow:hidden;aspect-ratio:85/54;background:#f5f7fa;}
.dni-cell.empty-cell{border:1px dashed var(--border);aspect-ratio:85/54;display:flex;align-items:center;justify-content:center;background:var(--surface);}
.dni-cell-num{font-size:9px;color:var(--muted);}
.dni-cell-img{width:100%;height:100%;object-fit:contain;background:#f5f7fa;display:block;cursor:pointer;}

.dni-sheet-footer{text-align:center;border-top:1px solid var(--border);margin-top:10px;padding-top:7px;font-size:9px;color:var(--muted);}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center;}
.lightbox.show{display:flex;}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain;}
.lightbox-close{position:absolute;top:20px;right:24px;color:white;font-size:32px;cursor:pointer;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:white;padding:10px 22px;border-radius:9px;font-size:13px;font-weight:500;transition:transform 0.3s;z-index:100;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}

@media print {
  .topbar,.left-col,.lightbox,.toast{display:none!important;}
  .main-layout{display:block;padding:0;}
  .dni-sheet-wrapper{position:static;}
  .col-title,.btn-print-dni{display:none!important;}
  .dni-sheet{border:none;box-shadow:none;padding:8mm;}
  .dni-grid{gap:3mm;grid-template-columns:repeat(3,1fr);}
  .dni-cell{break-inside:avoid;aspect-ratio:85/54;}
  .dni-cell.empty-cell{aspect-ratio:85/54;}
  .dni-cell-img{width:100%;height:100%;object-fit:contain;background:#f5f7fa;}
  body{background:white;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="admin.html" class="btn-back">← Admin</a>
    <div>
      <div class="topbar-title">📄 Resumen general</div>
      <div class="topbar-sub">Los DNIs aparecen en la hoja derecha en tiempo real</div>
    </div>
  </div>
</div>

<div class="main-layout">

  <!-- IZQUIERDA -->
  <div class="left-col">
    <div class="col-title">Participantes</div>
    <div id="person-list"><div class="empty">⏳ Cargando...</div></div>
  </div>

  <!-- DERECHA: hoja DNIs -->
  <div class="dni-sheet-wrapper">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div class="col-title" style="margin-bottom:0;">Hoja DNIs <span style="font-weight:400;font-size:11px;text-transform:none;letter-spacing:0;">(máx. 12)</span></div>
      <button class="btn-print-dni" onclick="window.print()">🖨️ Imprimir DNIs</button>
    </div>
    <div class="dni-sheet">
      <div class="dni-sheet-top">
        <div class="dni-sheet-brand">🤿 Buceo Hispania — Reserva de Cabo Tiñoso</div>
        <div class="dni-sheet-date" id="sheet-date"></div>
      </div>
      <div class="dni-grid" id="dni-grid"></div>
      <div class="dni-sheet-footer">Los huecos se rellenan según llegan los formularios</div>
    </div>
  </div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">✕</span>
  <img id="lightbox-img" src="" alt="Documento">
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAO8VpDW_FH98KzDjWVQifAhkka8eT1298",
  authDomain: "hipaniadocs.firebaseapp.com",
  databaseURL: "https://hipaniadocs-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hipaniadocs",
  storageBucket: "hipaniadocs.firebasestorage.app",
  messagingSenderId: "960546133872",
  appId: "1:960546133872:web:83221679b511d1c5ba21b5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// Fecha
const d = new Date();
document.getElementById('sheet-date').textContent =
  d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});

// Auth anónima → luego escuchar datos
signInAnonymously(auth).then(() => {
  onValue(ref(db,'personas'), (snapshot) => {
    const data = snapshot.val();
    renderLeft(data);
    renderDniSheet(data);
  });
}).catch(() => showToast('❌ Error de conexión'));

// ── IZQUIERDA ──────────────────────────────
function renderLeft(data) {
  const list = document.getElementById('person-list');
  if (!data) { list.innerHTML = '<div class="empty">No hay datos todavía.</div>'; return; }
  const entries = sorted(data);
  let html = '';
  entries.forEach(([id,p],i) => {
    const ns = esc(p.nombre||'');
    if (p.completado) {
      let docs = '';
      if (p.dni_archivo||p.dni_foto) docs += thumb('📄 DNI',(p.dni_archivo||p.dni_foto).data);
      if (p.tit_archivo||p.tit_foto) docs += thumb('🏅 Titulación',(p.tit_archivo||p.tit_foto).data);
      if (p.seg_archivo||p.seg_foto) docs += thumb('🛡️ Seguro',(p.seg_archivo||p.seg_foto).data);
      let comps = '';
      if (p.acompanantes&&p.acompanantes.length) {
        p.acompanantes.forEach((c,ci)=>{
          const cd = (c.dni_archivo||c.dni_foto) ? thumb('📄 DNI',(c.dni_archivo||c.dni_foto).data) : '';
          comps += `<div class="companion-block">
            <div class="companion-hdr">👤 Acompañante ${ci+1}</div>
            <div class="fields-grid" style="padding:10px 12px;">
              <div><div class="copy-lbl">DNI</div><div class="copy-row"><div class="copy-val">${c.dniNum||'—'}</div><button class="btn-copy" onclick="copyText('${esc(c.dniNum||'')}',this)">Copiar</button></div></div>
              <div><div class="copy-lbl">Nombre</div><div class="copy-row"><div class="copy-val">${c.nombre||'—'}</div><button class="btn-copy" onclick="copyText('${esc(c.nombre||'')}',this)">Copiar</button></div></div>
            </div>
            ${cd?`<div class="docs-row" style="padding:0 12px 10px;">${cd}</div>`:''}
          </div>`;
        });
      }
      html += `<div class="person-block">
        <div class="person-header">
          <div><div class="person-name">${i+1}. ${p.nombre||'—'}</div><div class="person-phone">${p.telefono||'—'}</div></div>
          <div style="display:flex;align-items:center;gap:7px;">
            <span class="badge badge-ok">✅ Listo</span>
            <button class="btn-del" onclick="delPerson('${id}','${ns}')">✕</button>
          </div>
        </div>
        <div class="fields-grid">
          <div><div class="copy-lbl">Número de DNI</div><div class="copy-row"><div class="copy-val">${p.dniNum||'—'}</div><button class="btn-copy" onclick="copyText('${esc(p.dniNum||'')}',this)">Copiar</button></div></div>
          <div><div class="copy-lbl">Nombre completo</div><div class="copy-row"><div class="copy-val">${p.nombre||'—'}</div><button class="btn-copy" onclick="copyText('${esc(p.nombre||'')}',this)">Copiar</button></div></div>
          <div><div class="copy-lbl">Teléfono</div><div class="copy-row"><div class="copy-val">${p.telefono||'—'}</div><button class="btn-copy" onclick="copyText('${esc(p.telefono||'')}',this)">Copiar</button></div></div>
        </div>
        ${docs?`<div class="docs-row">${docs}</div>`:''}
        ${comps}
      </div>`;
    } else {
      html += `<div class="pending-block">
        <div class="pending-hdr">
          <div><div class="pending-name">${i+1}. ${p.nombre||'—'}</div><div style="font-size:11px;color:var(--amber);margin-top:1px;">${p.telefono||''}</div></div>
          <div style="display:flex;align-items:center;gap:7px;">
            <span class="badge badge-pending">⏳ Pendiente</span>
            <button class="btn-del" onclick="delPerson('${id}','${ns}')">✕</button>
          </div>
        </div>
        <div style="padding:10px 16px;text-align:center;color:var(--muted);font-size:12px;background:white;">Aún no ha enviado la documentación</div>
      </div>`;
    }
  });
  list.innerHTML = html || '<div class="empty">No hay datos todavía.</div>';
}

// ── HOJA DNIs — solo foto, sin nombre ni número ──
function renderDniSheet(data) {
  const grid = document.getElementById('dni-grid');
  const MAX = 12;
  if (!data) { grid.innerHTML = emptyCells(1,MAX); return; }

  const completed = sorted(data).filter(([,p])=>p.completado);
  const all = [];
  completed.forEach(([,p]) => {
    all.push({ img: (p.dni_archivo||p.dni_foto)?.data||null });
    if (p.acompanantes&&p.acompanantes.length) {
      p.acompanantes.forEach(c => {
        all.push({ img: (c.dni_archivo||c.dni_foto)?.data||null });
      });
    }
  });

  let html = '';
  const slice = all.slice(0,MAX);
  slice.forEach((d) => {
    const isImg = d.img && d.img.startsWith('data:image');
    html += `<div class="dni-cell">
      ${isImg
        ? `<img class="dni-cell-img" src="${d.img}" onclick="openLightbox('${d.img}')" title="Ampliar">`
        : `<div class="dni-cell-img" style="display:flex;align-items:center;justify-content:center;font-size:24px;background:#e8f4f8;">🪪</div>`}
    </div>`;
  });

  for (let i = slice.length+1; i <= MAX; i++) {
    html += `<div class="dni-cell empty-cell"><span class="dni-cell-num">${i}. —</span></div>`;
  }
  grid.innerHTML = html;
}

function sorted(data) {
  return Object.entries(data).sort((a,b)=>(a[1].fechaCreacion||0)-(b[1].fechaCreacion||0));
}

function thumb(label, src) {
  if (!src) return '';
  if (src.startsWith('data:image')) {
    return `<div class="doc-thumb"><div class="doc-thumb-hdr">${label}</div><img class="doc-thumb-img" src="${src}" onclick="openLightbox('${src}')" title="Ampliar"><div class="doc-thumb-ftr">✓ Ampliar</div></div>`;
  }
  return `<div class="doc-thumb"><div class="doc-thumb-hdr">${label}</div><div class="doc-thumb-img ph">📄</div><div class="doc-thumb-ftr" style="cursor:pointer;" onclick="dlFile('${src}')">⬇️ PDF</div></div>`;
}

function emptyCells(from,to) {
  let h='';
  for(let i=from;i<=to;i++) h+=`<div class="dni-cell empty-cell"><span class="dni-cell-num">${i}. —</span></div>`;
  return h;
}

function esc(s){return(s||'').replace(/'/g,"\\'");}

window.delPerson = function(id,nombre){
  if(!confirm(`¿Eliminar a ${nombre}? Se borrarán todos sus datos.`)) return;
  remove(ref(db,'personas/'+id)).then(()=>showToast('🗑️ Eliminado')).catch(()=>showToast('❌ Error'));
};
window.copyText = function(text,btn){
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='✓ Copiado'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copiar';btn.classList.remove('copied');},2000);
  });
};
window.openLightbox = function(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('show');
};
window.closeLightbox = function(){
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightbox-img').src='';
};
window.dlFile = function(src){
  const a=document.createElement('a');a.href=src;a.download='documento.pdf';a.click();
};

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
</script>
</body>
</html>
